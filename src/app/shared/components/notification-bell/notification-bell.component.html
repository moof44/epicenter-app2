<button mat-icon-button [matMenuTriggerFor]="notifMenu" class="btn-notif-bell" title="Notifications">
  <mat-icon [matBadge]="notifService.unreadCount() > 0 ? notifService.unreadCount() : null"
            matBadgeColor="warn"
            class="bell-icon"
            [class.has-unread]="notifService.unreadCount() > 0">
    {{ notifService.unreadCount() > 0 ? 'notifications_active' : 'notifications' }}
  </mat-icon>
</button>

<mat-menu #notifMenu="matMenu" xPosition="before" class="dark-pro-notif-menu">
  <div class="notif-menu-wrapper" (click)="$event.stopPropagation()" (keydown)="$event.stopPropagation()" role="presentation" tabindex="-1">
    
    <!-- Header -->
    <div class="notif-menu-header">
      <div class="header-left">
        <span class="header-title">Notifications</span>
        <span class="unread-pill" *ngIf="notifService.unreadCount() > 0">
          {{ notifService.unreadCount() }} New
        </span>
      </div>
      <button type="button" class="btn-mark-read-text" 
              *ngIf="notifService.unreadCount() > 0" 
              (click)="markAllRead()">
        <mat-icon class="check-icon">done_all</mat-icon>
        <span>Mark all read</span>
      </button>
    </div>

    <!-- Scrollable Notification List -->
    <div class="notif-list-container">
      <div *ngIf="notifService.notifications().length === 0" class="empty-notif-state">
        <div class="empty-icon-seal">
          <mat-icon>notifications_off</mat-icon>
        </div>
        <p class="empty-title">All caught up!</p>
        <span class="empty-sub">No unread notifications at the moment</span>
      </div>

      <button type="button" 
              *ngFor="let item of notifService.notifications() | slice:0:8"
              (click)="handleNotifClick(item)"
              [class.unread-item]="!item.read"
              class="notif-dropdown-row">
        
        <!-- Severity Icon Seal -->
        <div class="notif-type-seal" [ngClass]="item.type || 'info'">
          <mat-icon *ngIf="item.type === 'alert'">error_outline</mat-icon>
          <mat-icon *ngIf="item.type === 'warning'">warning_amber</mat-icon>
          <mat-icon *ngIf="item.type === 'summary'">analytics</mat-icon>
          <mat-icon *ngIf="item.type === 'info' || !item.type">info_outline</mat-icon>
        </div>

        <!-- Text Content -->
        <div class="notif-text-content">
          <div class="notif-title-row">
            <strong class="notif-title">{{ item.title }}</strong>
            <span class="notif-time">{{ formatTime(item.timestamp) }}</span>
          </div>
          <p class="notif-body">{{ item.body }}</p>
        </div>

        <!-- Glowing Unread Indicator Dot -->
        <div class="unread-glow-dot" *ngIf="!item.read"></div>
      </button>
    </div>

    <!-- Footer -->
    <div class="notif-menu-footer">
      <button type="button" class="btn-view-all-center" (click)="goToAllNotifications()">
        <span>View Notifications Center</span>
        <mat-icon class="arrow-icon">arrow_forward</mat-icon>
      </button>
    </div>

  </div>
</mat-menu>
