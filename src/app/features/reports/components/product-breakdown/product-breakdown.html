<div class="product-breakdown-container">
  <div class="chart-header">
    <div class="header-left">
      <h3 class="text-white">Product Sales Breakdown</h3>
      <p class="text-muted">Top retail product distribution by revenue or volume</p>
    </div>
    <div class="toggle-group">
      <button type="button" class="tab-chip chip-gold" [class.active]="metric === 'revenue'" (click)="setMetric('revenue')">₱ Revenue</button>
      <button type="button" class="tab-chip chip-cyan" [class.active]="metric === 'quantity'" (click)="setMetric('quantity')">📦 Quantity</button>
    </div>
  </div>

  <div class="chart-content">
    <apx-chart
      [series]="chartOptions.series!"
      [chart]="chartOptions.chart!"
      [labels]="chartOptions.labels!"
      [title]="chartOptions.title!"
      [legend]="chartOptions.legend!"
      [dataLabels]="chartOptions.dataLabels!"
      [tooltip]="chartOptions.tooltip!"
      [colors]="chartOptions.colors!">
    </apx-chart>
  </div>
</div>
