<div class="member-attendance-container">
  <div class="chart-header">
    <div class="header-left">
      <h3 class="text-white">🏆 Top Gym Goers Attendance Leaderboard</h3>
      <p class="text-muted">Most dedicated members with highest physical gym check-ins</p>
    </div>
  </div>

  <div class="chart-content">
    <apx-chart
      *ngIf="data && data.length > 0; else noAttendance"
      [series]="chartOptions.series!"
      [chart]="chartOptions.chart!"
      [xaxis]="chartOptions.xaxis!"
      [yaxis]="chartOptions.yaxis!"
      [title]="chartOptions.title!"
      [plotOptions]="chartOptions.plotOptions!"
      [dataLabels]="chartOptions.dataLabels!"
      [grid]="chartOptions.grid!"
      [tooltip]="chartOptions.tooltip!"
      [colors]="chartOptions.colors!">
    </apx-chart>
    <ng-template #noAttendance>
      <div class="empty-chart-state">
        <mat-icon class="empty-icon">person_off</mat-icon>
        <p class="empty-title">No Member Attendance Recorded</p>
        <p class="empty-desc">Check-in volume will populate here once members scan their badge.</p>
      </div>
    </ng-template>
  </div>
</div>
