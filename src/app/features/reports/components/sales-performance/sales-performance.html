<div class="sales-perf-container">
  <div class="chart-header">
    <div class="header-left">
      <h3 class="text-white">Sales Revenue vs Targets</h3>
      <p class="text-muted">Daily retail and membership income measured against target quotas</p>
    </div>
  </div>

  <div class="chart-content">
    <apx-chart
      *ngIf="data && data.length > 0; else noSales"
      [series]="chartOptions.series!"
      [chart]="chartOptions.chart!"
      [xaxis]="chartOptions.xaxis!"
      [yaxis]="chartOptions.yaxis!"
      [title]="chartOptions.title!"
      [stroke]="chartOptions.stroke!"
      [dataLabels]="chartOptions.dataLabels!"
      [labels]="chartOptions.labels!"
      [legend]="chartOptions.legend!"
      [grid]="chartOptions.grid!"
      [tooltip]="chartOptions.tooltip!"
      [colors]="chartOptions.colors!">
    </apx-chart>
    <ng-template #noSales>
      <div class="empty-chart-state">
        <mat-icon class="empty-icon">payments</mat-icon>
        <p class="empty-title">No Sales Records Found</p>
        <p class="empty-desc">Revenue pacing will display once sales are registered in this date window.</p>
      </div>
    </ng-template>
  </div>
</div>
