<div class="staff-sales-container">
  <div class="chart-header">
    <div class="header-left">
      <h3 class="text-white">Staff Sales Leaderboard</h3>
      <p class="text-muted">Total store items & passes sold per staff member</p>
    </div>
  </div>

  <div class="chart-content">
    <apx-chart
      *ngIf="data && data.length > 0; else noStaffSales"
      [series]="chartOptions.series!"
      [chart]="chartOptions.chart!"
      [xaxis]="chartOptions.xaxis!"
      [yaxis]="chartOptions.yaxis!"
      [title]="chartOptions.title!"
      [plotOptions]="chartOptions.plotOptions!"
      [dataLabels]="chartOptions.dataLabels!"
      [grid]="chartOptions.grid!"
      [tooltip]="chartOptions.tooltip!"
      [colors]="chartOptions.colors!">
    </apx-chart>
    <ng-template #noStaffSales>
      <div class="empty-chart-state">
        <mat-icon class="empty-icon">badge</mat-icon>
        <p class="empty-title">No Staff Sales Recorded</p>
        <p class="empty-desc">Attributed staff transactions will appear here once processed.</p>
      </div>
    </ng-template>
  </div>
</div>
