<div class="dark-dialog-container">
  
  <!-- Header -->
  <div class="dialog-header">
    <div class="header-title-wrap">
      <div class="dialog-icon-seal">
        <mat-icon>add_box</mat-icon>
      </div>
      <div>
        <h2 class="dialog-title">Create New Product</h2>
        <span class="dialog-subtitle">Add a new retail product or consumable for inventory</span>
      </div>
    </div>
    <button type="button" class="btn-close-circle" (click)="close()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- Form Body -->
  <form [formGroup]="productForm" class="dialog-form-body">
    
    <!-- Product Name -->
    <mat-form-field appearance="outline" class="custom-mat-field">
      <mat-label>Product Name</mat-label>
      <input matInput formControlName="name" placeholder="e.g. Whey Protein Isolate">
      <mat-icon matSuffix>label</mat-icon>
    </mat-form-field>

    <!-- Description -->
    <mat-form-field appearance="outline" class="custom-mat-field">
      <mat-label>Description (Optional)</mat-label>
      <textarea matInput formControlName="description" rows="2" placeholder="Brief notes about flavor, packaging, etc."></textarea>
    </mat-form-field>

    <div class="fields-row-2">
      <!-- Product Type -->
      <mat-form-field appearance="outline" class="custom-mat-field">
        <mat-label>Product Type</mat-label>
        <mat-select formControlName="type">
          <mat-option value="RETAIL">Retail (For Sale)</mat-option>
          <mat-option value="CONSUMABLE">Consumable (Gym Use)</mat-option>
        </mat-select>
      </mat-form-field>

      <!-- Category -->
      <mat-form-field appearance="outline" class="custom-mat-field">
        <mat-label>Category</mat-label>
        <mat-select formControlName="category">
          <mat-option *ngFor="let cat of categories" [value]="cat">{{ cat }}</mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <div class="fields-row-2">
      <!-- Selling Price -->
      <mat-form-field appearance="outline" class="custom-mat-field">
        <mat-label>Selling Price</mat-label>
        <span matTextPrefix class="currency-prefix">₱&nbsp;</span>
        <input matInput type="number" formControlName="price" min="0" step="0.01">
      </mat-form-field>

      <!-- Unit of Measure -->
      <mat-form-field appearance="outline" class="custom-mat-field">
        <mat-label>Unit of Measure</mat-label>
        <input matInput formControlName="unit" placeholder="e.g. Item, Bottle, Scoop">
      </mat-form-field>
    </div>

    <!-- Actions -->
    <div class="dialog-actions">
      <button type="button" class="btn-cancel" (click)="close()">Cancel</button>
      <button type="button" class="btn-save-cyan" [disabled]="productForm.invalid || isSaving" (click)="save()">
        <mat-icon class="btn-icon">check</mat-icon>
        <span>{{ isSaving ? 'Creating...' : 'Create Product' }}</span>
      </button>
    </div>

  </form>

</div>
